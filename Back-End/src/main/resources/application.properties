server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geracao_livre_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
geracaolivre.jwt.secret=${JWT_SECRET}
geracaolivre.jwt.expiration=86400000
geracaolivre.cors.origins=${CORS_ORIGINS:http://localhost:3000}
geracaolivre.checkout-simulado=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.springframework.security=WARN
geracaolivre.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
geracaolivre.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
geracaolivre.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
