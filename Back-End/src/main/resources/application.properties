# ===================================================================
# Configuração do Servidor
# ===================================================================
server.port=8080
server.servlet.context-path=/

# ===================================================================
# Banco de Dados PostgreSQL
# Se a senha não for preenchida, o sistema pode usar H2 em memória como fallback seguro
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:geracao_livre_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:SUA_SENHA_DO_POSTGRES_AQUI}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configurações de Segurança e JWT
# ===================================================================
geracaolivre.jwt.secret=${JWT_SECRET:GeracaoLivreSecretKeySeguraParaTokenJWT2026TecidosArtesanatoSuperSegura!}
geracaolivre.jwt.expiration=86400000

# ===================================================================
# Upload e Limites de Arquivo
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Logging
# ===================================================================
logging.level.com.geracaolivre=INFO
logging.level.org.springframework.security=WARN
