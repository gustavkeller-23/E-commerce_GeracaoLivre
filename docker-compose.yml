version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: geracao_livre_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geracao_livre_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SUA_SENHA_DO_POSTGRES_AQUI}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-geracao_livre_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geracao_net

  backend:
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    container_name: geracao_livre_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-geracao_livre_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-SUA_SENHA_DO_POSTGRES_AQUI}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: ${JWT_SECRET:-GeracaoLivreChaveSeguraParaTokenJWT2026TecidosArtesanato123456789!}
    ports:
      - "8080:8080"
    networks:
      - geracao_net

  frontend:
    build:
      context: ./Front-End
      dockerfile: Dockerfile
    container_name: geracao_livre_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - geracao_net

volumes:
  postgres_data:
    driver: local

networks:
  geracao_net:
    driver: bridge
